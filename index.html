<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marvel Timeline</title>
  <meta name="description" content="La timeline di tutti i film e le serie del Marvel Cinematic Universe, in ordine di uscita.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Marvel <span>Timeline</span></h1>
    <p class="subtitle">Film e serie del Marvel Cinematic Universe in ordine di uscita</p>
    <nav class="filters" aria-label="Filtra per tipo">
      <button type="button" data-filter="all" class="active">Tutti</button>
      <button type="button" data-filter="film">Film</button>
      <button type="button" data-filter="serie">Serie</button>
      <button type="button" data-filter="speciale">Speciali</button>
    </nav>
  </header>

  <main id="timeline" class="timeline"></main>

  <footer class="site-footer">
    <p>Progetto personale non ufficiale. Locandine da <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.</p>
  </footer>

  <script src="data.js"></script>
  <script src="posters.js"></script>
  <script src="app.js"></script>
</body>
</html>
